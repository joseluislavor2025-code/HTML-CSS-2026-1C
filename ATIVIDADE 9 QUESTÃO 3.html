<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 3 - Classes</title>
    <style>
        /* Criando uma classe para destacar o texto que a gente quiser */
        .destaque-amarelo {
            background-color: #fff9c4;
            padding: 3px;
            font-weight: bold;
        }
        .texto-importante {
            color: #c62828;
        }
    </style>
</head>
<body>
    <h1>Usando classes no CSS</h1>
    <p>Este parágrafo tá normal, mas <span class="destaque-amarelo">esta palavrinha tá com o fundo destacado</span> usando a classe.</p>
    <p class="texto-importante">Este parágrafo inteiro tá pintado de vermelho por causa da classe.</p>
</body>
</html>
