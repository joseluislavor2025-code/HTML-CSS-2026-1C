<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 4 - IDs</title>
    <style>
        /* O ID é único na página, usado para elementos principais */
        #topo-do-site {
            background-color: #37474f;
            color: white;
            padding: 15px;
            text-align: center;
        }
        #rodape-pagina {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: #78909c;
        }
    </style>
</head>
<body>
    <div id="topo-do-site">
        <h1>Meu Cabeçalho Principal (ID)</h1>
    </div>
    
    <p>Aqui fica o conteúdo principal do site, logo abaixo do cabeçalho.</p>

    <div id="rodape-pagina">
        <p>Desenvolvido por mim para a aula de HTML.</p>
    </div>
</body>
</html>
