<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 2 - Estilo Interno</title>
    <!-- Aqui vai o CSS dentro do head para organizar a página toda de uma vez -->
    <style>
        body {
            background-color: #fafafa;
            font-family: Arial, sans-serif;
            color: #444;
            margin: 30px;
        }
        h2 {
            color: #0277bd;
        }
    </style>
</head>
<body>
    <h2>Testando o estilo interno na mesma página</h2>
    <p>Diferente do inline, aqui a gente agrupa as regras de design ali em cima no cabeçalho.</p>
</body>
</html>
