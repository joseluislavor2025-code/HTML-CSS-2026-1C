<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 5 - Posicionamento de Imagem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 50px;
        }

        /* Estilo da caixinha de texto principal para organizar a página */
        .conteudo {
            max-width: 600px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="conteudo">
        <h1>Exercício 5 - Lição 12</h1>
        <p>Esta página demonstra como posicionar elementos de forma absoluta na tela usando estilos CSS, conforme o exemplo da apostila.</p>
    </div>

    <!-- Imagem do Android posicionada exatamente como pedido no exercício -->
    <img src="android.gif" alt="Android" style="position: absolute; bottom: 50px; right: 10px;" />

</body>
</html>
